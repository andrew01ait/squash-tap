<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Squash Tap diagnostics</title><style>
:root{color-scheme:dark}body{background:#080d17;color:#edf4ff;font:16px/1.6 system-ui;margin:0}main{max-width:720px;margin:auto;padding:32px 22px}h1{font-size:30px;letter-spacing:-.03em}p{color:#b6c7de}button,a{display:inline-block;padding:12px 16px;border-radius:12px;border:1px solid #355071;background:#173450;color:#bfe5ff;font:inherit;text-decoration:none;margin:6px 7px 6px 0;cursor:pointer}button:disabled{opacity:.4}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#111d2e;border:1px solid #263951;padding:18px;border-radius:16px;font:13px/1.5 ui-monospace,monospace}small{color:#9db0c9}</style></head><body><main><h1>Export watch diagnostics</h1><p id="status">Reading the diagnostic QR code…</p><div><button id="save" disabled>Save text file</button><button id="share" disabled>Share file</button><button id="copy" disabled>Copy text</button></div><p><small>The report is processed on your phone and is not uploaded automatically. Review it before sharing.</small></p><pre id="report">No report loaded.</pre><a href="/">Back to Squash Tap</a></main><script>
let report='',filename='SquashTap-diagnostics.txt';
async function loadReport(){
 const status=document.getElementById('status');
 report='';document.getElementById('report').textContent='No report loaded.';
 status.textContent='Reading the diagnostic QR code…';
 for(const id of ['save','share','copy'])document.getElementById(id).disabled=true;
 try{
  const params=new URLSearchParams(location.hash.slice(1)),payload=params.get('d');
  if(!payload){status.textContent='On your watch open MENU → Settings → Diagnostics → Send to phone, then scan its QR code.';return;}
  if(payload.length>5000)throw new Error('Diagnostic payload is too large.');
  const raw=atob(payload.replace(/-/g,'+').replace(/_/g,'/'));const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const reader=stream.getReader(),chunks=[];let length=0;
  while(true){const value=await reader.read();if(value.done)break;length+=value.value.length;if(length>16000){await reader.cancel();throw new Error('Decoded report exceeds the size limit.');}chunks.push(value.value);}
  report=await new Blob(chunks).text();document.getElementById('report').textContent=report;
  status.textContent='Ready. Save, copy or share the report with support.';
  filename='SquashTap-diagnostics-'+new Date().toISOString().replace(/[:.]/g,'-')+'.txt';
  for(const id of ['save','share','copy'])document.getElementById(id).disabled=false;
  history.replaceState(null,'',location.pathname);
 }catch(error){status.textContent='Could not open this report: '+error.message;}
}
document.getElementById('save').onclick=()=>{const blob=new Blob([report],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);};
document.getElementById('share').onclick=async()=>{const file=new File([report],filename,{type:'text/plain'});try{if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:'Squash Tap diagnostics'});else document.getElementById('status').textContent='File sharing is unavailable here. Use Save text file to keep a copy of the report.';}catch(error){if(error.name!=='AbortError')document.getElementById('status').textContent=error.message;}};
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(report);document.getElementById('status').textContent='Report copied. You can paste it into a support message.';}catch(error){document.getElementById('status').textContent='Use Save text file if clipboard access is unavailable.';}};
window.addEventListener('hashchange',loadReport);loadReport();
</script></body></html>
