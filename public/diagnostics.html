<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow,nosnippet">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#080d17">
  <title>Keep Score diagnostics</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/diagnostics.css">
</head>
<body>
  <header>
    <a href="/" class="brand"><img src="/favicon.svg" width="34" height="34" alt="">Keep Score</a>
    <div id="diagnostic-language" data-language-control></div>
  </header>
  <main id="diagnostics" data-loaded="false">
    <section class="intro">
      <h1>Export watch diagnostics</h1>
      <p id="status" role="status">Reading the diagnostic QR code…</p>
      <div class="actions">
        <button id="save" disabled>Save text file</button>
        <button id="share" disabled>Share file</button>
        <button id="copy" disabled>Copy text</button>
      </div>
      <p class="privacy">The report is processed on your phone and is not uploaded automatically. Review it before sharing.</p>
    </section>
    <section class="report">
      <h2>Watch report</h2>
      <pre id="report" tabindex="0">No report loaded.</pre>
    </section>
  </main>
  <script type="module" src="/diagnostics.mjs"></script>
</body>
</html>
